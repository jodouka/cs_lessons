<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ένωσε τα σημεία</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf0;font-family:Arial,sans-serif;color:#374151;display:flex;justify-content:center;padding:14px}.app{width:min(760px,100%);background:white;border-radius:20px;padding:18px;box-shadow:0 2px 10px #0001;text-align:center}h1{font-size:clamp(23px,5vw,34px);margin:4px 0 12px;color:#374151}.instructions{background:#f5faef;border:3px solid #8abd4c;border-radius:18px;padding:14px;text-align:left;font-size:clamp(16px,3.4vw,21px);line-height:1.55;margin-bottom:12px}.board{position:relative;width:100%;max-width:700px;margin:auto;overflow:hidden;border-radius:12px}.board img{display:block;width:100%;height:auto}.dot{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;border:3px solid white;box-shadow:0 1px 4px #5558;transition:.15s}.dot.blue{background:#5d9bc8}.dot.red{background:#d13d31}.dot.selected{outline:4px solid #ffd34e;transform:translate(-50%,-50%) scale(1.12)}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:24px;padding:11px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#aaa;color:#fff}button.primary{background:#76ad3f}button:active{transform:scale(.97)}#message{min-height:28px;font-size:18px;font-weight:bold;margin-top:8px} .small{font-size:14px;color:#6b7280;margin-top:6px}</style>
</head><body><main class="app"><h1>👋 Ένωσε τα σημεία</h1><div class="instructions">Πάτησε ένα <span style="color:#397fb4;font-weight:bold">μπλε σημείο</span> και μετά ένα <span style="color:#c7352b;font-weight:bold">κόκκινο σημείο</span> για να τα ενώσεις. Για να σβήσεις μια γραμμή, πάτησε ξανά τα ίδια δύο σημεία.</div><div class="board" id="board"><img src="image.jpg" alt="Χέρι και πασχαλίτσα με χρωματιστά σημεία"><svg id="lines"></svg></div><div id="message">Διάλεξε ένα μπλε σημείο!</div><div class="controls"><button class="primary" id="clear">Καθαρισμός ♻️</button><button id="check">Έλεγχος ⭐</button></div><div class="small">Στόχος: ένωσε κάθε μπλε σημείο με το αντίστοιχο κόκκινο.</div></main>
<script>
const board=document.getElementById('board'), lines=document.getElementById('lines'), msg=document.getElementById('message');
const points=[['b1','blue',60.0,38.3],['b2','blue',50.2,51.4],['b3','blue',51.7,62.7],['r1','red',28.9,40.5],['r2','red',35.4,35.5],['r3','red',35.5,48.1],['r4','red',28.9,59.2],['r5','red',35.5,65.2],['r6','red',38.5,49.1]];
let selected=null, drawn=[]; const pairs={b1:'r2',b2:'r6',b3:'r5'};
points.forEach(([id,c,x,y])=>{let d=document.createElement('div');d.id=id;d.className='dot '+c;d.style.left=x+'%';d.style.top=y+'%';d.dataset.x=x;d.dataset.y=y;d.addEventListener('click',()=>pick(d));board.appendChild(d)});
function pick(d){if(!selected){if(!d.classList.contains('blue')){msg.textContent='Πρώτα διάλεξε ένα μπλε σημείο 🙂';return}selected=d;d.classList.add('selected');msg.textContent='Τώρα διάλεξε ένα κόκκινο σημείο!';return} if(d===selected){selected.classList.remove('selected');selected=null;msg.textContent='Διάλεξε ένα μπλε σημείο!';return} if(d.classList.contains('blue')){selected.classList.remove('selected');selected=d;d.classList.add('selected');return} const a=selected.id,b=d.id; let i=drawn.findIndex(p=>(p.a===a&&p.b===b)||(p.a===b&&p.b===a)); if(i>=0){drawn.splice(i,1);render();msg.textContent='Η γραμμή σβήστηκε. Συνέχισε!'}else{drawn.push({a,b});render();msg.textContent='Μπράβο! Συνέχισε με το επόμενο ζευγάρι.'}selected.classList.remove('selected');selected=null}
function render(){lines.innerHTML=drawn.map(p=>{let a=document.getElementById(p.a),b=document.getElementById(p.b);return `<line x1="${a.dataset.x}%" y1="${a.dataset.y}%" x2="${b.dataset.x}%" y2="${b.dataset.y}%" stroke="#f0b323" stroke-width="5" stroke-linecap="round"/>`}).join('')}
document.getElementById('clear').onclick=()=>{drawn=[];render();if(selected)selected.classList.remove('selected');selected=null;msg.textContent='Διάλεξε ένα μπλε σημείο!'};
document.getElementById('check').onclick=()=>{let ok=Object.entries(pairs).every(([a,b])=>drawn.some(p=>p.a===a&&p.b===b));msg.textContent=ok&&drawn.length===3?'🎉 Συγχαρητήρια! Τα ένωσες όλα σωστά!':'Δοκίμασε ξανά: κάθε μπλε σημείο ταιριάζει με ένα κόκκινο.'};
</script></body></html>
